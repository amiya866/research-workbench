<!doctype html>
<html lang="zh">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<script src="../lib/guard.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宏观研究 · 沈轶天</title>
<style>
  :root{--bg:#0d1117;--card:#141b28;--line:#262d3d;--gold:#d4a944;--txt:#d7dde8;--dim:#8a94a6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  .topbar{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    padding:10px 18px;background:#0d1117ee;border-bottom:1px solid var(--line);backdrop-filter:blur(6px);}
  .seg{display:flex;gap:6px;}
  .seg button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:7px 18px;font-size:14px;cursor:pointer;transition:all .15s;}
  .seg button:hover{border-color:var(--gold);}
  .seg button.on{background:var(--gold);border-color:var(--gold);color:#111;font-weight:600;}
  .author{font-size:14px;color:var(--gold);letter-spacing:.5px;white-space:nowrap;}
  .author b{font-size:15px;}
  iframe{display:block;width:100%;height:calc(100vh - 53px);border:0;background:var(--bg);}
  iframe[hidden]{display:none;}
  @media (max-width:640px){
    .topbar{padding:8px 10px;gap:6px;}
    .seg{flex:1;min-width:0;}
    .seg button{flex:1;padding:8px 4px;font-size:12.5px;border-radius:6px;}
    .author{font-size:12px;width:100%;text-align:right;}
    iframe{height:calc(100vh - 78px);}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="seg" id="seg">
    <button data-v="daily" class="on">日报</button>
    <button data-v="weekly">周报</button>
    <button data-v="trump">特朗普执政关注点</button>
  </div>
  <div class="author">宏观有色研究 · <b>沈轶天</b></div>
</div>
<iframe id="f-daily" src="daily_latest.html?v=20261009_2" title="宏观研究日报"></iframe>
<iframe id="f-weekly" data-lazy="weekly_2026-W35.html" title="宏观研究周报" hidden></iframe>
<iframe id="f-trump" data-lazy="../panels/trump_zone.html" title="特朗普执政关注焦点" hidden></iframe>
<script>
(function(){
  var seg=document.getElementById('seg');
  function show(v){
    seg.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v);});
    ['daily','weekly','trump'].forEach(function(k){
      var f=document.getElementById('f-'+k); if(!f)return;
      f.hidden = (k!==v);
      if(k===v && f.dataset.lazy && !f.dataset.loaded){ f.src=f.dataset.lazy; f.dataset.loaded='1'; }
    });
  }
  seg.addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.v);});
  var m=/[?&]v=(daily|weekly|trump)/.exec(location.search);
  if(m) show(m[1]);
  // 自动指向最新日报/周报（索引文件随新报告发布更新）
  fetch('../data/report_index.json?v='+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(ix){
    if(!ix) return;
    var V='?v='+(ix.updated||Date.now());
    if(ix.daily){ ix.daily+=V; var fd=document.getElementById('f-daily');
      if(fd.dataset.loaded||!fd.hidden){ if(!fd.src.endsWith(ix.daily)) fd.src=ix.daily; } else { fd.dataset.lazy=ix.daily; }
      fd.dataset.lazy=ix.daily; }
    if(ix.weekly){ ix.weekly+=V; var fw=document.getElementById('f-weekly');
      if(fw.dataset.loaded){ if(!fw.src.endsWith(ix.weekly)) fw.src=ix.weekly; } else { fw.dataset.lazy=ix.weekly; } }
  }).catch(function(){});
})();
</script>
</body>
</html>
